    <text x="28" y="208" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#7E7E92">SwiftUI  ·  SwiftData</text>
