    <text x="40" y="132" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#A6A6B8">Family medication companion: reminders, prescription</text><text x="40" y="160" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#A6A6B8">scanning, family sync, SOS and an AI voice assistant.</text>
    <text x="40" y="224" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#7E7E92">Flutter  ·  FastAPI  ·  Firebase</text>
  </g>
