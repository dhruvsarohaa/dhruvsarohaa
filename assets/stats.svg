<svg xmlns="http://www.w3.org/2000/svg" width="708" height="300" viewBox="0 0 708 300" role="img" aria-label="GitHub stats for the last 12 months">
<style>.rise { opacity: 0; animation: rise .45s cubic-bezier(.22, 1, .36, 1) forwards; } @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rise, .ln, .c, .bar { opacity: 1 !important; } .bar { transform: none !important; } .cover, .typing { display: none; } }</style>
  <rect x=".5" y=".5" width="707" height="299" rx="16" fill="#121219" stroke="#EEEEF6" stroke-opacity=".08"/>
  <text x="32" y="52" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#EEEEF6">GitHub</text><text x="676" y="52" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#7E7E92">last 12 months</text>
