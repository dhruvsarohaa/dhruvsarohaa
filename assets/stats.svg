  <g class="rise" style="animation-delay:0.10s"><text x="252" y="132" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="500" letter-spacing="-.6" fill="#EEEEF6" style="font-variant-numeric: tabular-nums;">315</text><text x="252" y="160" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#A6A6B8">Commits</text></g>
  <g class="rise" style="animation-delay:0.15s"><text x="472" y="132" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="500" letter-spacing="-.6" fill="#EEEEF6" style="font-variant-numeric: tabular-nums;">45</text><text x="472" y="160" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#A6A6B8">Active days</text></g>
