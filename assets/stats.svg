  <g class="rise" style="animation-delay:0.25s"><text x="252" y="236" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="500" letter-spacing="-.6" fill="#EEEEF6" style="font-variant-numeric: tabular-nums;">3d</text><text x="252" y="264" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#A6A6B8">Current streak</text></g>
